# CI — quality gates ของ Web UI ทั้งสองฝั่ง
# ฝั่ง Python pipeline (agents/core/tools) มี test หนักที่บางส่วนต้องใช้ API key จริง
# จึงรันเฉพาะ tests/api (Web UI backend) ที่ isolate ด้วย fake run_fn แล้วเท่านั้น
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web UI (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build รวม tsc -b (typecheck ทั้ง src + tests) แล้วค่อย vite build
      - run: npm run build

  api:
    name: API backend (pytest tests/api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/api -q

  architecture:
    name: Vault architecture and write-boundary contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/architecture -q
      - run: uv run pytest tests/application/knowledge tests/tools/archivist/test_vault_r8_*.py tests/tools/archivist/test_runtime_layout_r9.py tests/tools/archivist/test_runtime_migration_r9.py tests/tools/archivist/test_recovery_bundle_r9.py tests/api/test_knowledge_writes_r8.py tests/integration/test_portfolio_projection_rebuild.py -q --no-cov
      - run: mkdir -p scratch/vault-r8 scratch/vault-r9
      - run: uv run python scripts/scan_vault_writers_r8.py --root . --fail-on unresolved,review,expired > scratch/vault-r8/ci-writer-inventory.json
      - run: uv run python scripts/scan_vault_writers_r9.py --root . --fail-on unresolved,review,expired,broad_allowlist > scratch/vault-r9/ci-writer-inventory.json
      - run: uv run python -m compileall -q application tools api schemas scripts
